apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-k8s-app
  namespace: development

spec:

  replicas: 2

  selector:
    matchLabels:
      app: devops-k8s-app

  template:

    metadata:
      labels:
        app: devops-k8s-app

    spec:

      containers:

        - name: app

          image: nikhil031020/devops-k8s-app:latest

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 10
            periodSeconds: 10
